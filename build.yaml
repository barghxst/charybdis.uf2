# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # --- Bluetooth mode: right half = central, no dongle. ---
  - board: nice_nano_v2
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: right_bluetooth

  # --- Dongle mode: dongle = central, both halves peripheral. ---
  - board: nice_nano_v2
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: dongle
  - board: nice_nano_v2
    shield: charybdis_right_dongle
    artifact-name: right_dongle

  # --- Left half: same peripheral firmware for both modes. ---
  - board: nice_nano_v2
    shield: charybdis_left
    artifact-name: left

  # --- Settings reset (flash to wipe BLE bonds when switching modes). ---
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: reset
